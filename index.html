    <script>
      // --- Scroll to order-samples via sessionStorage ---
      (function() {
        var target = sessionStorage.getItem('vb-scroll');
        if (target) {
          sessionStorage.removeItem('vb-scroll');
          var tryScroll = function() {
            var el = document.getElementById(target);
            if (el) {
              setTimeout(function() { el.scrollIntoView({behavior:'smooth',block:'start'}); }, 800);
              return true;
            }
            return false;
          };
          if (!tryScroll()) {
            var n = 0, i = setInterval(function() { n++; if (tryScroll() || n > 40) clearInterval(i); }, 250);
          }
        }

        document.addEventListener('click', function(e) {
          var link = e.target.closest('a');
          if (link) {
            var style = link.getAttribute('style') || '';
            var href = link.getAttribute('href') || '';
            if (href === '/products' && style.indexOf('eb7d23') > -1) {
              sessionStorage.setItem('vb-scroll', 'order-samples');
            }
          }
        });

        (function() {
          var observer = new MutationObserver(function(mutations) {
            var imgs = document.querySelectorAll('img[alt="VoerBoost A"]');
            imgs.forEach(function(img) {
              if (!img.dataset.vfixed) {
                var parent = img.closest('div');
                if (parent && /[а-яА-ЯёЁ]/.test(parent.innerText)) {
                  img.dataset.vfixed = '1';
                  img.style.marginTop = '36px';
                }
              }
            });
          });
          observer.observe(document.body, { childList: true, subtree: true });
        })();
      })();
